<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Son Bot - Chat Interactivo</title>
  <meta name="description" content="Chat simple y moderno con bot de inteligencia artificial">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="style.css?v=1.009">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar / Panel de Info -->
    <aside class="sidebar">
      <div class="bot-profile">
        <div class="avatar-wrapper">
          <div class="avatar bot-avatar-large">
            <img src="avatar.png" alt="Son Bot" class="avatar-img" width="72" height="72" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;">
          </div>
          <span class="status-indicator online" title="En línea"></span>
        </div>
        <h2>Son Bot</h2>
        <p class="bot-tagline">Tu asistente inteligente, amigable y muy wow.</p>
      </div>

      <div class="quick-actions">
        <h3>💡 Preguntas sugeridas</h3>
        <button class="suggestion-chip" data-prompt="¿Qué puedes hacer por mí?">¿Qué puedes hacer?</button>
        <button class="suggestion-chip" data-prompt="Cuéntame un chiste divertido">Cuéntame un chiste 🎭</button>
        <button class="suggestion-chip" data-prompt="Dame una frase motivacional del día">Frase motivacional ✨</button>
        <button class="suggestion-chip" data-prompt="Escribe un código simple en JavaScript">Ejemplo de código 💻</button>
        <button class="suggestion-chip" data-prompt="Explícame qué es la Inteligencia Artificial">¿Qué es la IA? 🧠</button>
      </div>

      <!-- Tarjeta Promocional Doge Projects -->
      <a href="https://dogeprojects.netlify.app/" target="_blank" rel="noopener noreferrer" class="promo-card" title="Visitar Doge Projects">
        <div class="promo-content">
          <div class="promo-title">🚀 Doge Projects</div>
          <div class="promo-desc">Más juegos y aplicaciones</div>
        </div>
        <svg class="promo-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="7" y1="17" x2="17" y2="7"></line>
          <polyline points="7 7 17 7 17 17"></polyline>
        </svg>
      </a>

      <div class="sidebar-footer">
        <button id="clear-chat-btn" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18m-2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>
          Limpiar historial
        </button>
      </div>
    </aside>

    <!-- Área principal del Chat -->
    <main class="chat-wrapper">
      <!-- Header de chat -->
      <header class="chat-header">
        <div class="header-bot-info">
          <div class="avatar bot-avatar-small">
            <img src="avatar.png" alt="Son Bot" class="avatar-img" width="38" height="38" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;">
          </div>
          <div>
            <div class="header-name-row" style="display:flex; align-items:center;">
              <div class="header-name">Son Bot</div>
              <span class="version-badge" style="display:inline-block; margin-left:8px; padding:2px 8px; border-radius:12px; font-size:0.75rem; background:#00f0ff22; color:#00f0ff; border:1px solid #00f0ff; font-family:'Fira Code', monospace; font-weight:bold;">v1.009</span>
            </div>
            <div class="header-status">En línea • Siempre listo para ayudar</div>
          </div>
        </div>
        <div class="header-actions">
          <button id="theme-toggle-btn" class="icon-btn" title="Activar tema RGB / Pride">
            <span id="theme-icon">🏳️‍🌈</span>
          </button>
        </div>
      </header>

      <!-- Lista de Mensajes -->
      <div id="chat-messages" class="chat-messages">
        <!-- Los mensajes se inyectan dinámicamente mediante app.js -->
      </div>

      <!-- Indicador de tipeo -->
      <div id="typing-indicator" class="typing-indicator hidden">
        <div class="avatar bot-avatar-small">
          <img src="avatar.png" alt="Son Bot" class="avatar-img" width="38" height="38" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;">
        </div>
        <div class="dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <span class="typing-text">Son Bot está pensando...</span>
      </div>

      <!-- Formulario de entrada -->
      <footer class="chat-input-area">
        <form id="chat-form" class="chat-form">
          <!-- Barra rápida de emojis -->
          <div class="emoji-bar" id="emoji-bar">
            <button type="button" class="emoji-btn" data-emoji="😀" title="Sonrisa">😀</button>
            <button type="button" class="emoji-btn" data-emoji="😂" title="Risa">😂</button>
            <button type="button" class="emoji-btn" data-emoji="😍" title="Amor">😍</button>
            <button type="button" class="emoji-btn" data-emoji="😢" title="Triste">😢</button>
            <button type="button" class="emoji-btn" data-emoji="😡" title="Enojo">😡</button>
            <button type="button" class="emoji-btn" data-emoji="💩" title="Caca">💩</button>
          </div>

          <div class="input-container">
            <textarea 
              id="message-input" 
              placeholder="Escribe un mensaje aquí... (Presiona Enter para enviar)" 
              rows="1"
              maxlength="1000"
              required
            ></textarea>
            <button type="submit" id="send-btn" class="send-btn" title="Enviar mensaje">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
          <div class="input-hint">
            <span>Tip: <b>Shift + Enter</b> para salto de línea</span>
            <span id="char-counter">0 / 1000</span>
          </div>
        </form>
      </footer>
    </main>
  </div>

  <!-- NLP Libraries -->
  <script src="https://unpkg.com/compromise"></script>
  <script src="https://cdn.jsdelivr.net/npm/stemmer-es@1.0.0/dist/stemmer-es.min.js"></script>
  <script src="app.js?v=1.009"></script>
</body>
</html>
